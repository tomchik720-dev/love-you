<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let CX = 0;
let CY = 0;
let SCALE = 0;

const COUNT = 360;

const PINK = "#ff1493";
const PINK_LIGHT = "#ff4fa3";
const PINK_SOFT = "#ff75b8";

let particles = [];
let stars = [];

let startTime = performance.now();


// ============================================================
// CANVAS
// ============================================================

function resize() {

    const dpr =
        Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    CX = W / 2;

    // Немного поднимаем сердце,
    // чтобы снизу оставалось место
    CY = H / 2 + H * 0.015;

    /*
        Сердце специально сделано широким.

        На телефоне:
        ~92% ширины экрана
        ~72% высоты
    */

    SCALE = Math.min(
        W * 0.92 / 32,
        H * 0.72 / 26
    );
}


// ============================================================
// HEART
// ============================================================

function heartPoint(t) {

    const x =
        16 * Math.pow(
            Math.sin(t),
            3
        );

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {

        x:
            CX +
            x * SCALE,

        y:
            CY -
            y * SCALE
    };
}


// ============================================================
// RANDOM
// ============================================================

function random(min, max) {

    return Math.random() *
        (max - min) +
        min;
}


// ============================================================
// EASING
// ============================================================

function ease(t) {

    return t * t * (3 - 2 * t);
}


// ============================================================
// CREATE PARTICLES
// ============================================================

function createParticles() {

    particles = [];

    for (let i = 0; i < COUNT; i++) {

        /*
            Распределяем точки по сердцу.
            Небольшой случайный разброс делает
            сердце живым.
        */

        const t =
            (i / COUNT) *
            Math.PI * 2;

        const target =
            heartPoint(t);

        target.x += random(-3, 3);
        target.y += random(-3, 3);


        // ----------------------------------------------------
        // Начальная позиция
        // ----------------------------------------------------

        let sx;
        let sy;

        const side =
            Math.floor(
                Math.random() * 4
            );

        if (side === 0) {

            // Сверху

            sx = random(-100, W + 100);
            sy = random(-H, -30);

        }

        else if (side === 1) {

            // Справа

            sx = random(W + 30, W + 400);
            sy = random(-50, H + 50);

        }

        else if (side === 2) {

            // Снизу

            sx = random(-100, W + 100);
            sy = random(H + 30, H + 400);

        }

        else {

            // Слева

            sx = random(-400, -30);
            sy = random(-50, H + 50);
        }


        // ----------------------------------------------------
        // Размер
        // ----------------------------------------------------

        const size =
            Math.floor(
                random(11, 20)
            );


        // ----------------------------------------------------
        // Цвет
        // ----------------------------------------------------

        const colors = [

            PINK,
            PINK,
            PINK,
            PINK_LIGHT,
            PINK_SOFT

        ];


        const color =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        particles.push({

            sx: sx,
            sy: sy,

            tx: target.x,
            ty: target.y,

            size: size,

            color: color,

            /*
                Небольшая задержка между словами
            */

            delay:
                i * 0.012,

            // случайная скорость
            speed:
                random(0.85, 1.15)
        });
    }
}


// ============================================================
// BACKGROUND STARS
// ============================================================

function createStars() {

    stars = [];

    const amount =
        Math.min(
            90,
            Math.floor(
                W * H / 10000
            )
        );

    for (let i = 0; i < amount; i++) {

        stars.push({

            x: random(0, W),

            y: random(0, H),

            size: random(0.5, 1.5),

            alpha: random(0.15, 0.5),

            speed: random(0.5, 1.5)
        });
    }
}


// ============================================================
// DRAW BACKGROUND
// ============================================================

function drawBackground(time) {

    ctx.fillStyle = "#020002";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // --------------------------------------------------------
    // Звёзды
    // --------------------------------------------------------

    for (const star of stars) {

        const alpha =
            star.alpha +
            Math.sin(
                time * star.speed
            ) * 0.12;

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,105,180,${Math.max(
                0.05,
                alpha
            )})`;

        ctx.fill();
    }
}


// ============================================================
// DRAW LOVE YOU
// ============================================================

function drawText(
    x,
    y,
    size,
    color,
    alpha = 1
) {

    ctx.save();

    ctx.font =
        `bold ${size}px Arial, sans-serif`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle =
        color;

    ctx.globalAlpha =
        alpha;

    ctx.shadowColor =
        color;

    ctx.shadowBlur =
        5;

    ctx.fillText(
        "LOVE YOU",
        x,
        y
    );

    ctx.restore();
}


// ============================================================
// HEART GLOW
// ============================================================

function drawHeartGlow(time) {

    /*
        После сборки сердце слегка пульсирует.
    */

    const pulse =
        1 +
        Math.sin(time * 2.5) *
        0.012;


    ctx.save();

    ctx.translate(
        CX,
        CY
    );

    ctx.scale(
        pulse,
        pulse
    );

    ctx.translate(
        -CX,
        -CY
    );


    // --------------------------------------------------------
    // Glow
    // --------------------------------------------------------

    ctx.globalAlpha = 0.055;

    ctx.shadowColor =
        "#ff1493";

    ctx.shadowBlur =
        35;


    ctx.beginPath();

    for (
        let i = 0;
        i <= 100;
        i++
    ) {

        const t =
            (i / 100) *
            Math.PI * 2;

        const point =
            heartPoint(t);

        if (i === 0) {

            ctx.moveTo(
                point.x,
                point.y
            );

        } else {

            ctx.lineTo(
                point.x,
                point.y
            );
        }
    }

    ctx.closePath();

    ctx.strokeStyle =
        "#ff1493";

    ctx.lineWidth =
        8;

    ctx.stroke();

    ctx.restore();
}


// ============================================================
// ANIMATION
// ============================================================

    const time =
        (now - startTime) / 1000;

    // BACKGROUND
    // --------------------------------------------------------

    drawBackground(time);
