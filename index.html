    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,

    const y =
        13 * Math.cos(t)

        Растяжение:

        HEART_HEIGHT

    */

    const HEART_WIDTH = 1.0;
    const HEART_HEIGHT = 1.18;


    return {

        x:
            CX +
            x *
            SCALE *
            HEART_WIDTH,

        y:
            CY -
            y *
            SCALE *
            HEART_HEIGHT
    };
}


// ============================================================
// RANDOM

function random(min, max) {

    return Math.random() *
        (max - min) +

function drawBackground(time) {

    ctx.fillStyle =
        "#020002";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    for (
        const star of stars

            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2

            `rgba(
                255,
                105,
                180,
                ${Math.max(
                    0.05,
                    alpha
                )}
            )`;

        ctx.fill();
    }
}
